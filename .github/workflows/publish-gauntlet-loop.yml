name: Publish Gauntlet Loop v1.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: gauntlet-loop-v1-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message == 'bootstrap: publish Gauntlet Loop v1.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Acquire and integrity-check frozen source
        env:
          SOURCE_URL: https://gauntlet-loop-ayush.serveo.net/gauntlet-source.tar.gz
          SOURCE_SHA_URL: https://gauntlet-loop-ayush.serveo.net/gauntlet-source.sha256
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gauntlet-source.tar.gz"
          checksum="$RUNNER_TEMP/gauntlet-source.sha256"
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 20 --max-time 300 "$SOURCE_URL" -o "$archive"
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 20 --max-time 60 "$SOURCE_SHA_URL" -o "$checksum"
          expected="$(tr -d '[:space:]' < "$checksum")"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          echo "$expected  $archive" | sha256sum --check --strict
          tar -tzf "$archive" >/dev/null
          echo "SOURCE_SHA256=$expected" >> "$GITHUB_ENV"
          echo "SOURCE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Extract and inspect standalone source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/source"
          rm -rf "$source_root"
          mkdir -p "$source_root"
          tar -xzf "$SOURCE_ARCHIVE" -C "$source_root"
          for path in \
            README.md \
            LICENSE \
            VERSION \
            skills/gauntlet-loop/SKILL.md \
            scripts/run_all.py \
            .claude-plugin/marketplace.json \
            .claude-plugin/plugin.json \
            .codex-plugin/plugin.json \
            .agents/plugins/marketplace.json; do
            test -f "$source_root/$path" || { echo "Missing required path: $path" >&2; exit 1; }
          done
          test "$(tr -d '[:space:]' < "$source_root/VERSION")" = '1.0.0'
          echo "SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Run complete release validation before publication
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          python scripts/run_all.py
          test -f dist/gauntlet-loop.skill
          test -f dist/VALIDATION_REPORT.txt
          test -f dist/security-scan.json
          test -f dist/RELEASE_STATUS.json

      - name: Replace bootstrap tree and create clean public commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SOURCE_ROOT"/. .
          rm -rf .git 2>/dev/null || true
          # Recreate the checkout metadata if an archive unexpectedly contained .git.
          test -d "$GITHUB_WORKSPACE/.git"
          rm -f .bootstrap-upload-test.txt
          rm -f .github/workflows/bootstrap-release.yml .github/workflows/publish-gauntlet-loop.yml
          git config user.name 'Ayush Lochab'
          git config user.email '193861067+Nice6042@users.noreply.github.com'
          git add --all
          for path in dist/gauntlet-loop.skill dist/SHA256SUMS dist/RELEASE_SHA256SUMS dist/security-scan.json dist/VALIDATION_REPORT.txt dist/RELEASE_STATUS.json; do
            test -f "$path" && git add --force "$path"
          done
          git commit -m 'Initial release: Gauntlet Loop v1.0.0'
          commit="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Tag exact validated commit
        env:
          TARGET_SHA: ${{ steps.publish.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.0.0 --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git push origin :refs/tags/v1.0.0 2>/dev/null || true
          git tag -a v1.0.0 "$TARGET_SHA" -m 'Gauntlet Loop v1.0.0'
          git push origin refs/tags/v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.publish.outputs.commit }}

      - name: Create verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.publish.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Gauntlet Loop v1.0.0

          Portable, explicitly invoked Builder–Critic multi-agent quality campaigns with dependency-safe parallel Loop Tasks, Combiner integration loops, configurable Wowed thresholds, 26 independent quality gates, persistent evidence, recovery, and cross-host adapters.

          The exact tagged source passed the repository's complete validation suite before publication.

          Source transport SHA-256: \`$SOURCE_SHA256\`
          Tagged commit: \`$TARGET_SHA\`
          EOF
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          gh release create v1.0.0 "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Gauntlet Loop v1.0.0' \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

      - name: Verify published repository, tag, release, and install surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.publish.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" --jq .object.type)" = 'tag'
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" --jq .object.sha)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .object.sha)" = "$TARGET_SHA"
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq 'select(.tagName == "v1.0.0" and .isDraft == false and .isPrerelease == false)'
          for path in README.md LICENSE skills/gauntlet-loop/SKILL.md .claude-plugin/marketplace.json .codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" >/dev/null
          done
          clone="$RUNNER_TEMP/public-clone"
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$clone"
          cd "$clone"
          python scripts/run_all.py

      - name: Record successful publication
        env:
          TARGET_SHA: ${{ steps.publish.outputs.commit }}
        shell: bash
        run: |
          echo "Published Gauntlet Loop v1.0.0 at $TARGET_SHA"
