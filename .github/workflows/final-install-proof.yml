name: Prove public Gauntlet Loop installability

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  statuses: write
  pull-requests: write

concurrency:
  group: gauntlet-loop-final-proof
  cancel-in-progress: false

jobs:
  prove:
    if: "github.event.head_commit.message == 'release: prove public installability'"
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select current source or recover frozen source
        shell: bash
        env:
          SOURCE_URL: https://gauntlet-loop-ayush.serveo.net/gauntlet-source.tar.gz
          SOURCE_SHA_URL: https://gauntlet-loop-ayush.serveo.net/gauntlet-source.sha256
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/source"
          rm -rf "$source_root"
          mkdir -p "$source_root"
          if test -f skills/gauntlet-loop/SKILL.md && test -f scripts/run_all.py; then
            tar --exclude=.git -cf - . | tar -xf - -C "$source_root"
            echo 'Using source already present on main.'
          else
            archive="$RUNNER_TEMP/gauntlet-source.tar.gz"
            checksum="$RUNNER_TEMP/gauntlet-source.sha256"
            curl --fail --location --retry 12 --retry-all-errors --connect-timeout 20 --max-time 360 "$SOURCE_URL" -o "$archive"
            curl --fail --location --retry 12 --retry-all-errors --connect-timeout 20 --max-time 60 "$SOURCE_SHA_URL" -o "$checksum"
            expected="$(tr -d '[:space:]' < "$checksum")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            echo "$expected  $archive" | sha256sum --check --strict
            tar -xzf "$archive" -C "$source_root"
            echo "SOURCE_SHA256=$expected" >> "$GITHUB_ENV"
            echo 'Recovered frozen source.'
          fi
          echo "SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Validate all required files and manifests
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md LICENSE VERSION
            skills/gauntlet-loop/SKILL.md
            scripts/run_all.py
            .claude-plugin/marketplace.json
            .claude-plugin/plugin.json
            .codex-plugin/plugin.json
            .agents/plugins/marketplace.json
          )
          for path in "${required[@]}"; do
            test -f "$SOURCE_ROOT/$path" || { echo "Missing $path" >&2; exit 1; }
          done
          test "$(tr -d '[:space:]' < "$SOURCE_ROOT/VERSION")" = 1.0.0
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['SOURCE_ROOT'])
          for rel in (
              '.claude-plugin/marketplace.json',
              '.claude-plugin/plugin.json',
              '.codex-plugin/plugin.json',
              '.agents/plugins/marketplace.json',
          ):
              json.loads((root / rel).read_text(encoding='utf-8'))
          skill = (root / 'skills/gauntlet-loop/SKILL.md').read_text(encoding='utf-8')
          frontmatter = skill.split('---', 2)[1]
          assert 'name: gauntlet-loop' in frontmatter
          assert 'description:' in frontmatter
          PY

      - name: Run full suite before publication
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          python scripts/run_all.py
          test -s dist/gauntlet-loop.skill
          test -s dist/VALIDATION_REPORT.txt
          test -s dist/security-scan.json
          test -s dist/RELEASE_STATUS.json

      - name: Materialize final clean source tree
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SOURCE_ROOT"/. .
          test -d .git
          rm -f .bootstrap-upload-test.txt
          rm -f \
            .github/workflows/bootstrap-release.yml \
            .github/workflows/publish-gauntlet-loop.yml \
            .github/workflows/publish-gauntlet-loop-final.yml \
            .github/workflows/final-install-proof.yml
          python scripts/run_all.py
          git config user.name 'Ayush Lochab'
          git config user.email '193861067+Nice6042@users.noreply.github.com'
          git add --all
          while IFS= read -r path; do git add --force "$path"; done < <(find dist -maxdepth 1 -type f -print | sort)
          if git diff --cached --quiet; then
            echo 'Final source tree already materialized.'
          else
            git commit -m 'chore: finalize public install surfaces'
            git push origin HEAD:main
          fi
          target="$(git rev-parse HEAD)"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Verify public clone and Agent Skills discovery
        env:
          TARGET_SHA: ${{ steps.materialize.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          clone="$RUNNER_TEMP/public-clone"
          rm -rf "$clone"
          git clone --depth 1 https://github.com/Nice6042/gauntlet-loop.git "$clone"
          cd "$clone"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python scripts/run_all.py
          npx -y skills@latest add Nice6042/gauntlet-loop --list > "$RUNNER_TEMP/skills-list.txt"
          grep -F 'gauntlet-loop' "$RUNNER_TEMP/skills-list.txt"

      - name: Bind v1.0.0 and release assets to final commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.materialize.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.0.0 --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git push origin :refs/tags/v1.0.0 2>/dev/null || true
          git tag -a v1.0.0 "$TARGET_SHA" -m 'Gauntlet Loop v1.0.0'
          git push origin refs/tags/v1.0.0
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Gauntlet Loop v1.0.0

          Portable, explicitly invoked Builder–Critic multi-agent quality campaigns with dependency-safe parallel Loop Tasks, recursive Combiner integration loops, configurable Wowed thresholds, all 26 independent quality gates, persistent evidence, recovery, and cross-host adapters.

          The tagged source passed the complete local suite, a fresh public-clone suite, and Agent Skills repository discovery before this release was created.

          Tagged commit: \`$TARGET_SHA\`
          EOF
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -ge 4
          gh release create v1.0.0 "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Gauntlet Loop v1.0.0' \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

      - name: Verify tag, release, and every public install surface
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.materialize.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" --jq .object.type)" = tag
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" --jq .object.sha)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .object.sha)" = "$TARGET_SHA"
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets --jq 'select(.tagName == "v1.0.0" and .isDraft == false and .isPrerelease == false and (.assets | length) >= 4)'
          for path in README.md LICENSE VERSION skills/gauntlet-loop/SKILL.md .claude-plugin/marketplace.json .claude-plugin/plugin.json .codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" >/dev/null
          done
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='gauntlet-loop/public-install' \
            -f description='Fresh clone, full validation, manifests, tag, release, and skills discovery passed' >/dev/null
          gh pr close 1 --repo "$GITHUB_REPOSITORY" --comment 'Closed after the final public source, fresh-clone validation, Agent Skills discovery, v1.0.0 tag, and release verification passed.' 2>/dev/null || true
