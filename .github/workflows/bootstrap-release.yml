name: Bootstrap standalone Gauntlet Loop release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gauntlet-loop-bootstrap-release
  cancel-in-progress: false

jobs:
  publish:
    if: "github.event.head_commit.message == 'bootstrap: initialize standalone release publisher'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the final source commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BOOTSTRAP_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            head_sha="$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
            if [[ -n "$head_sha" && "$head_sha" != "$BOOTSTRAP_SHA" ]]; then
              echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "Final source commit was not published before the guarded timeout." >&2
          exit 1

      - name: Check out the final source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.wait.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate the exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.0.0"
          python scripts/run_all.py

      - name: Create annotated v1.0.0 tag
        env:
          TARGET_SHA: ${{ steps.wait.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gauntlet Loop Release Bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            remote_tag="$(git ls-remote origin refs/tags/v1.0.0^{} | awk '{print $1}')"
            if [[ -z "$remote_tag" ]]; then
              remote_tag="$(git ls-remote origin refs/tags/v1.0.0 | awk '{print $1}')"
            fi
            test "$remote_tag" = "$TARGET_SHA"
          else
            git tag -a v1.0.0 "$TARGET_SHA" -m "Gauntlet Loop v1.0.0"
            git push origin refs/tags/v1.0.0
          fi

      - name: Create the GitHub release and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/gauntlet-loop.skill
            dist/SHA256SUMS
            dist/security-scan.json
            dist/VALIDATION_REPORT.txt
            dist/RELEASE_STATUS.json
          )
          while IFS= read -r generated; do
            [[ -n "$generated" ]] && assets+=("$generated")
          done < <(find dist -maxdepth 1 -type f \( -name 'gauntlet-loop-*-source.zip' -o -name 'gauntlet-loop-v*.bundle' -o -name 'RELEASE_SHA256SUMS' \) -print | sort)
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "${assets[@]}" --clobber
          else
            gh release create v1.0.0 "${assets[@]}" \
              --title "Gauntlet Loop v1.0.0" \
              --notes "Portable, explicitly invoked Builder–Critic multi-agent quality campaigns with configurable completion standards, dependency-safe parallel waves, integration criticism, evidence ledgers, and cross-host adapters. The exact tagged source passed the complete deterministic validation suite before this release was created."
          fi

      - name: Verify public release state
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.wait.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" --jq .object.type)" = "tag"
          gh release view v1.0.0 --json tagName,isDraft,isPrerelease --jq 'select(.tagName == "v1.0.0" and .isDraft == false and .isPrerelease == false)'
