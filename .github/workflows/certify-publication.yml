name: Certify Gauntlet Loop public installation

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write
  pull-requests: write

concurrency:
  group: gauntlet-loop-public-certification
  cancel-in-progress: false

jobs:
  certify:
    if: "github.event.head_commit.message == 'release: certify Gauntlet Loop public installation'"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Require complete standalone source
        shell: bash
        run: |
          set -euo pipefail
          for path in README.md LICENSE VERSION skills/gauntlet-loop/SKILL.md scripts/run_all.py .claude-plugin/marketplace.json .claude-plugin/plugin.json .codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            test -f "$path" || { echo "Missing public install surface: $path" >&2; exit 1; }
          done
          test "$(tr -d '[:space:]' < VERSION)" = 1.0.0
          test ! -e .bootstrap-upload-test.txt
          test ! -e .github/workflows/bootstrap-release.yml
          test ! -e .github/workflows/publish-gauntlet-loop.yml
          test ! -e .github/workflows/publish-gauntlet-loop-final.yml
          test ! -e .github/workflows/final-install-proof.yml
          test ! -e .github/workflows/finalize-source-release.yml

      - name: Validate manifests and full suite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for rel in (
              '.claude-plugin/marketplace.json',
              '.claude-plugin/plugin.json',
              '.codex-plugin/plugin.json',
              '.agents/plugins/marketplace.json',
          ):
              json.loads(Path(rel).read_text(encoding='utf-8'))
          skill = Path('skills/gauntlet-loop/SKILL.md').read_text(encoding='utf-8')
          frontmatter = skill.split('---', 2)[1]
          assert 'name: gauntlet-loop' in frontmatter
          assert 'description:' in frontmatter
          PY
          python scripts/run_all.py
          test -s dist/gauntlet-loop.skill
          test -s dist/VALIDATION_REPORT.txt
          test -s dist/security-scan.json
          test -s dist/RELEASE_STATUS.json

      - name: Prove Agent Skills repository discovery
        shell: bash
        run: |
          set -euo pipefail
          npx -y skills@latest add Nice6042/gauntlet-loop --list | tee "$RUNNER_TEMP/skills-list.txt"
          grep -F gauntlet-loop "$RUNNER_TEMP/skills-list.txt"

      - name: Add durable certification and remove temporary workflow
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/PUBLICATION_VERIFIED.md <<EOF
          # Public publication verification

          Gauntlet Loop v1.0.0 was certified from GitHub Actions on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          The certification gate verified:

          - the complete standalone source tree is present on public main;
          - the canonical Agent Skill and Claude, Codex, and Agent marketplace manifests exist and parse;
          - the repository's complete validation suite passes;
          - a fresh public clone passes the same complete suite;
          - the Agent Skills CLI discovers \`gauntlet-loop\` from \`Nice6042/gauntlet-loop\`;
          - the annotated \`v1.0.0\` tag and non-draft GitHub Release point to this certified source;
          - release artifacts are attached and public.

          The tag target is the commit containing this file.
          EOF
          rm -f .github/workflows/certify-publication.yml
          git config user.name 'Ayush Lochab'
          git config user.email '193861067+Nice6042@users.noreply.github.com'
          git add --all
          git commit -m 'docs: certify public v1.0.0 installation'
          target="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Revalidate exact certified public commit
        env:
          TARGET_SHA: ${{ steps.commit.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          clone="$RUNNER_TEMP/certified-clone"
          git clone --depth 1 https://github.com/Nice6042/gauntlet-loop.git "$clone"
          cd "$clone"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f docs/PUBLICATION_VERIFIED.md
          python scripts/run_all.py
          npx -y skills@latest add Nice6042/gauntlet-loop --list > "$RUNNER_TEMP/certified-skills-list.txt"
          grep -F gauntlet-loop "$RUNNER_TEMP/certified-skills-list.txt"

      - name: Rebind tag and release to certified commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.0.0 --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git push origin :refs/tags/v1.0.0 2>/dev/null || true
          git tag -a v1.0.0 "$TARGET_SHA" -m 'Gauntlet Loop v1.0.0'
          git push origin refs/tags/v1.0.0
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Gauntlet Loop v1.0.0

          Portable, explicitly invoked Builder–Critic multi-agent quality campaigns with dependency-safe parallel Loop Tasks, recursive Combiner integration loops, configurable Wowed thresholds, 26 independent quality gates, persistent evidence, recovery, and cross-host adapters.

          This release is bound to the certified public source. The complete suite, fresh public-clone suite, cross-host manifests, and Agent Skills discovery all passed before the release was created.

          Certified commit: \`$TARGET_SHA\`
          EOF
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -ge 4
          gh release create v1.0.0 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title 'Gauntlet Loop v1.0.0' --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" --jq .object.sha)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .object.sha)" = "$TARGET_SHA"
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets --jq 'select(.isDraft == false and .isPrerelease == false and (.assets | length) >= 4)'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -f state=success -f context='gauntlet-loop/public-install' -f description='Certified fresh clone, full suite, manifests, skills discovery, tag, and release' >/dev/null
          gh pr close 1 --repo "$GITHUB_REPOSITORY" --comment 'Closed after public source, fresh-clone validation, Agent Skills discovery, annotated v1.0.0 tag, release assets, and durable publication certification passed.' 2>/dev/null || true
