name: Certify Agent Skills, Codex, and Claude installs

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: gauntlet-loop-host-install-certification
  cancel-in-progress: false

jobs:
  certify:
    if: "github.event.head_commit.message == 'release: certify Agent Skills Codex and Claude installs'"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Revalidate certified public source
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/PUBLICATION_VERIFIED.md
          test -f docs/INSTALLATION_VERIFIED.md
          for path in README.md LICENSE VERSION skills/gauntlet-loop/SKILL.md scripts/run_all.py .claude-plugin/marketplace.json .claude-plugin/plugin.json .codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            test -f "$path"
          done
          python scripts/run_all.py

      - name: Install with Agent Skills CLI
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/skills-install"
          mkdir -p "$root/home" "$root/project"
          cd "$root/project"
          export HOME="$root/home" XDG_CONFIG_HOME="$root/home/.config" XDG_DATA_HOME="$root/home/.local/share" CI=1
          npx -y skills@latest add Nice6042/gauntlet-loop --skill gauntlet-loop --yes
          installed="$(find "$root" -type f -path '*/gauntlet-loop/SKILL.md' -print -quit)"
          test -n "$installed"
          grep -q '^name: gauntlet-loop$' "$installed"

      - name: Install as a Codex plugin
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/codex-install"
          mkdir -p "$root/home" "$root/project"
          cd "$root/project"
          export HOME="$root/home" XDG_CONFIG_HOME="$root/home/.config" XDG_DATA_HOME="$root/home/.local/share" CODEX_HOME="$root/home/.codex" CI=1
          npx -y @openai/codex@latest plugin marketplace add Nice6042/gauntlet-loop
          npx -y @openai/codex@latest plugin add gauntlet-loop@gauntlet-loop
          installed="$(find "$root" -type f -path '*/gauntlet-loop/SKILL.md' -print -quit)"
          test -n "$installed"
          grep -q '^name: gauntlet-loop$' "$installed"

      - name: Install as a Claude Code plugin
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/claude-install"
          mkdir -p "$root/home" "$root/project"
          cd "$root/project"
          export HOME="$root/home" XDG_CONFIG_HOME="$root/home/.config" XDG_DATA_HOME="$root/home/.local/share" CI=1
          npx -y @anthropic-ai/claude-code@latest plugin marketplace add Nice6042/gauntlet-loop
          npx -y @anthropic-ai/claude-code@latest plugin install gauntlet-loop@gauntlet-loop
          installed="$(find "$root" -type f -path '*/gauntlet-loop/SKILL.md' -print -quit)"
          test -n "$installed"
          grep -q '^name: gauntlet-loop$' "$installed"

      - name: Commit durable cross-host verification
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/HOST_INSTALLATION_VERIFIED.md <<'EOF'
          # Cross-host installation verification

          Gauntlet Loop v1.0.0 was installed from the public `Nice6042/gauntlet-loop` repository in isolated temporary environments through all three supported native routes:

          ## Agent Skills CLI

          ```bash
          npx -y skills@latest add Nice6042/gauntlet-loop --skill gauntlet-loop --yes
          ```

          ## Codex plugin marketplace

          ```bash
          npx -y @openai/codex@latest plugin marketplace add Nice6042/gauntlet-loop
          npx -y @openai/codex@latest plugin add gauntlet-loop@gauntlet-loop
          ```

          ## Claude Code plugin marketplace

          ```bash
          npx -y @anthropic-ai/claude-code@latest plugin marketplace add Nice6042/gauntlet-loop
          npx -y @anthropic-ai/claude-code@latest plugin install gauntlet-loop@gauntlet-loop
          ```

          Each installation produced a discoverable `gauntlet-loop/SKILL.md` with the expected canonical skill metadata. These tests used clean HOME and configuration directories and did not rely on a pre-existing local checkout.
          EOF
          rm -f .github/workflows/certify-host-installs.yml
          git config user.name 'Ayush Lochab'
          git config user.email '193861067+Nice6042@users.noreply.github.com'
          git add --all
          git commit -m 'docs: certify cross-host installation'
          target="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Fresh-clone final certified commit
        env:
          TARGET_SHA: ${{ steps.commit.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          clone="$RUNNER_TEMP/final-clone"
          git clone --depth 1 https://github.com/Nice6042/gauntlet-loop.git "$clone"
          cd "$clone"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f docs/HOST_INSTALLATION_VERIFIED.md
          python scripts/run_all.py

      - name: Bind release to final cross-host-certified commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.0.0 --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git push origin :refs/tags/v1.0.0 2>/dev/null || true
          git tag -a v1.0.0 "$TARGET_SHA" -m 'Gauntlet Loop v1.0.0'
          git push origin refs/tags/v1.0.0
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Gauntlet Loop v1.0.0

          Portable, explicitly invoked Builder–Critic multi-agent quality campaigns with dependency-safe parallel Loop Tasks, recursive Combiner integration loops, configurable Wowed thresholds, 26 independent quality gates, persistent evidence, recovery, and cross-host adapters.

          The exact tagged source passed the complete suite, fresh public-clone validation, and clean isolated installation through Agent Skills, Codex, and Claude Code.

          Certified commit: \`$TARGET_SHA\`
          EOF
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -ge 4
          gh release create v1.0.0 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title 'Gauntlet Loop v1.0.0' --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" --jq .object.sha)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .object.sha)" = "$TARGET_SHA"
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets --jq 'select(.isDraft == false and .isPrerelease == false and (.assets | length) >= 4)'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" -f state=success -f context='gauntlet-loop/cross-host-install' -f description='Agent Skills, Codex, Claude, full suite, tag, and release passed' >/dev/null
